version: '3.8'

# =============================================================================
# Docker Compose für TeaTracker3 (Backend + Frontend + PostgreSQL)
# Anpassung für Portainer mit Verzeichnis: /home/teetracker3
# =============================================================================
# In Portainer:
# 1. Stack erstellen und diese Datei hochladen
# 2. Arbeitsverzeichnis: /home/teetracker3
# 3. POSTGRES_PASSWORD anpassen
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Datenbank
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: teetracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: teetracker
      POSTGRES_USER: teetracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_portainer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teetracker -d teetracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teetracker_network

  # ===========================================================================
  # API-Server (Backend)
  # ===========================================================================
  api:
    build:
      context: /home/teetracker3
      dockerfile: /home/teetracker3/artifacts/api-server/Dockerfile
    container_name: teetracker-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "postgresql://teetracker:${POSTGRES_PASSWORD:-change_me_in_portainer}@postgres:5432/teetracker"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - teetracker_network

  # ===========================================================================
  # Frontend (React + Vite)
  # ===========================================================================
  frontend:
    build:
      context: /home/teetracker3
      dockerfile: /home/teetracker3/artifacts/tea-tracker/Dockerfile
    container_name: teetracker-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 80
      BASE_PATH: "/"
      VITE_API_URL: "http://localhost:5000"
    ports:
      - "8080:80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - teetracker_network

# ===========================================================================
# Volumes (für persistente Daten)
# ===========================================================================
volumes:
  postgres_data:
    driver: local

# ===========================================================================
# Netzwerk (für interne Kommunikation)
# ===========================================================================
networks:
  teetracker_network:
    driver: bridge
